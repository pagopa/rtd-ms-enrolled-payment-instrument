version: "3.9"
services:

  # external services
  db:
    build:
      context: .
      dockerfile: mongo-replica.dockerfile
    container_name: db
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root
      - MONGO_INITDB_DATABASE=rtd
    volumes:
      - db1:/data/db
#    depends_on:
#      - db2
    networks:
      - internal-net
  db2:
    image: mongo:4.0@sha256:4ca81c89ad08f4cfa9906005126112bffe8fb363800466ef5e50f6238f6f6af1
    entrypoint: [ "/usr/bin/mongod", "--bind_ip_all", "--replSet", "rs0" ]
    container_name: db2
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root
      - MONGO_INITDB_DATABASE=rtd
    volumes:
      - db2:/data/db
    networks:
      - internal-net

  zookeeper:
    image: confluentinc/cp-zookeeper@sha256:3abfc3079b0882381e5723f74132246bfd17eb7ff04e8cf7313321425ff65426
    container_name: zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
      - ZOOKEEPER_SYNC_LIMIT=2
    networks:
      - internal-net

  kafka:
    image: confluentinc/cp-kafka@sha256:97ccaea18d99784f60743b0d71921b68930cd71fcfbec15b4dbbf812c75a33fd
    hostname: kafka
    container_name: kafka
    ports:
      - "29095:29095"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_HOST://localhost:29095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_MIN_SESSION_TIMEOUT_MS: 3000
    networks:
      - internal-net
    depends_on:
      - zookeeper

volumes:
  db1:
  db2:

networks:
  internal-net:
    driver: bridge